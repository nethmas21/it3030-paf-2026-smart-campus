# ── Application ──────────────────────────────────────────────────────────────
spring.application.name=smart-campus
server.port=8081

# ── Active profile: change to 'prod' for MySQL ───────────────────────────────
spring.profiles.active=prod

# ── CORS ─────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=http://localhost:3000

# ── File upload ───────────────────────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=15MB
app.upload.dir=uploads/tickets

# ── Google OAuth2 ─────────────────────────────────────────────────────────────
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:test-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:test-google-client-secret}

# JWT issued after successful Google OAuth login
app.jwt.secret=${JWT_SECRET:change-this-development-secret-to-at-least-32-bytes}
app.jwt.expiration-ms=86400000
app.oauth2.redirect-url=http://localhost:3000/oauth/callback
app.admin.email=${APP_ADMIN_EMAIL:}
 
# ── JPA ───────────────────────────────────────────────────────────────────────
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
 
# ── Session ───────────────────────────────────────────────────────────────────
server.servlet.session.cookie.same-site=lax
